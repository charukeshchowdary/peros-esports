name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Peros Esports Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: |
          npm install

      - name: 🌐 Package Web Assets
        run: |
          npm run prepare-www

      - name: 🤖 Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🛠️ Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: 🔨 Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 🏷️ Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Peros-Esports.apk

      - name: 🚀 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peros-Esports-APK
          path: build-output/Peros-Esports.apk
          retention-days: 30

      - name: 🌟 Release APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: build-output/Peros-Esports.apk
          name: Peros Esports Official App
          tag_name: v1.0.0
          draft: false
          prerelease: false
          body: |
            ## 🔥 Peros Esports Official Android App
            - **Platform**: Where Every Clutch Counts! ⚡
            - **Version**: 1.0.0
            - Download `Peros-Esports.apk` below and install on any Android device!
